<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic DOM Manipulation</title>
</head>
<body>

    <label for="name">Name:</label>

  </form>
  <script src="script.js"></script>
</body>
</html>
